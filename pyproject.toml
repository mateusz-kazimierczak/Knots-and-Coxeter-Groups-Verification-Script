[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coxeter-knot-checker"
version = "0.1.0"
description = "Exact checks for Coxeter-gallery knots and the Theorem 3 search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Verification package for Knots and Coxeter Groups"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
coxeter-knot-checker = "coxeter_knot_checker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
